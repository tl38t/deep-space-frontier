  <div class="redline-banner">x</div>

</div>

<script>
window.addEventListener('error', function(e){ window.__errs = window.__errs||[]; window.__errs.push(e.message); });
setTimeout(function(){
  try {
    var out = {};
    // 切到成员页
    location.hash = 'members';
    var view = document.getElementById('nsk-view');
    out.memberCards = view.querySelectorAll('.member-card').length;
    out.goalChips = view.querySelectorAll('.goal-chip').length;
    out.perCard = out.memberCards ? Math.round(out.goalChips / out.memberCards) : 0;
    // 开第一个成员详情
    var card = view.querySelector('[data-act^="npc:"]');
    out.firstCardAct = card ? card.getAttribute('data-act') : null;
    card.dispatchEvent(new MouseEvent('click', {bubbles:true}));
    var mask = document.querySelector('.wh-detail-mask');
    out.detailOpened = !!mask;
    out.goalRows = mask ? mask.querySelectorAll('.goal-row').length : 0;
    out.multText = mask ? (mask.querySelector('.whd-sec .cnt')||{}).textContent : null;
    // 找一个可点目的按钮（赠予/满足舰船）
    var btn = mask ? mask.querySelector('button[data-act^="goalgive:"],button[data-act^="goalship:"]') : null;
    out.foundActionBtn = !!btn;
    if (btn) {
      var beforeDone = mask.querySelectorAll('.goal-row.done').length;
      btn.dispatchEvent(new MouseEvent('click', {bubbles:true}));
      var mask2 = document.querySelector('.wh-detail-mask');
      out.doneBefore = beforeDone;
      out.doneAfter = mask2 ? mask2.querySelectorAll('.goal-row.done').length : 0;
      out.multAfter = mask2 ? (mask2.querySelector('.whd-sec .cnt')||{}).textContent : null;
      out.detailName = mask2 ? (mask2.querySelector('.whd-name')||{}).textContent : null;
    }
    out.errs = window.__errs || [];
    var pre = document.createElement('pre'); pre.id='out'; pre.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(pre);
  } catch (ex) {
    var p = document.createElement('pre'); p.id='out'; p.textContent = 'THROW: ' + ex.message + '\n' + (ex.stack||'');
    document.body.appendChild(p);
  }
}, 400);
</script>
</body>
</html>
