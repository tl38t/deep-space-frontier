<div id="nsk-app">

  <div class="redline-banner">⚠️ 离线结算铁律（§14.5）：单核时间戳驱动 · 纯闭式 · 绝不逐秒回放 · dt 封顶 24h · 计算耗时 O(1)（离线 30 天 = 离线 1 小时）</div>
  <nav id="nsk-tabs"><div class="tab" data-act="tab:starmap">星图</div><div class="tab" data-act="tab:system">星系</div><div class="tab" data-act="tab:base">舰基</div><div class="tab" data-act="tab:warehouse">仓库</div><div class="tab" data-act="tab:members">成员</div><div class="tab" data-act="tab:factions">势力</div><div class="tab on" data-act="tab:story">剧情<i class="tab-dot"></i></div><div class="tab" data-act="tab:report">日报</div><div class="tab" data-act="tab:settings">设置</div></nav>
  <main id="nsk-view"><h2>剧情</h2><div class="story-play"><div class="dlg fx-holo"><div class="dlg-head"><div class="dlg-av"><img src="assets/portraits/guides/nsk_guide_flora_bust.webp" alt="菲欧娜" draggable="false" onerror="this.parentNode.classList.add('miss')"><span class="av-ph">菲</span></div><div class="dlg-body"><div class="dlg-name" style="color:#62d5af">菲欧娜</div><div class="dlg-text">您好，指挥官，我是隶属于联邦拓殖公社的边疆区统括助理AI，全称为 Frontier Integrated Operations and Networking Assistant，通称 F.I.O.N.A，欢迎来到边疆区，接下来，我将——</div><div class="dlg-bar"><button class="sm" data-act="story:next">下一句 ›</button><span class="dlg-prog">1 / 6</span><span class="dim">序章 · 边疆登记处</span></div></div></div></div></div></main>
</div>

<div id="nsk-nodepop"></div>
<aside id="nsk-activity"></aside>

<!-- 设置 / 存档面板 -->
<div id="nsk-settings" class="nsk-overlay">
  <div class="nsk-panel">
    <div class="nsk-panel-head">设置 · 存档 <button id="nsk-settings-close" class="nsk-x" aria-label="关闭">✕</button></div>
    <div class="nsk-cloud-status" id="nsk-cloud-status">云存档：检测中…</div>
    <div class="nsk-row">
      <button id="nsk-export-code" class="sm">生成存档码</button>
      <button id="nsk-copy-code" class="sm" disabled="">复制存档码</button>
    </div>
    <textarea id="nsk-code-area" class="nsk-code" placeholder="存档码 / 存档文本（NSK1. / NSK1P. / NSK2. / 信封JSON）" readonly=""></textarea>
    <div class="nsk-row">
      <button id="nsk-import-code" class="sm" disabled="">导入上方存档码</button>
    </div>
    <div class="nsk-row">
      <button id="nsk-export-file" class="sm">导出存档文件</button>
      <label class="sm file-btn">导入存档文件<input type="file" id="nsk-import-file" accept=".json,.txt,application/json" hidden=""></label>
    </div>
    <div class="nsk-row danger-row">
      <button id="nsk-delete-save" class="sm danger-btn">删除本机存档</button>
    </div>
    <div class="nsk-hint" id="nsk-settings-hint"></div>
  </div>
</div>

<!-- 启动存档冲突弹窗（本地 vs 云端） -->
<div id="nsk-cloud-conflict" class="nsk-overlay">
  <div class="nsk-panel">
    <div class="nsk-panel-head">存档冲突</div>
    <div class="nsk-conflict-body" id="nsk-conflict-body"></div>
    <div class="nsk-row">
      <button id="nsk-conflict-local" class="sm">保留本机</button>
      <button id="nsk-conflict-cloud" class="sm primary">使用云端</button>
    </div>
  </div>
</div>
