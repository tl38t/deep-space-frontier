<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>深空星疆 · 商业与战争</title>
<link rel="stylesheet" href="css/main.css?v=62">
</head>
<body>
<div id="nsk-app">
  <header id="nsk-hud"></header>
  <div class="redline-banner">⚠️ 离线结算铁律（§14.5）：单核时间戳驱动 · 纯闭式 · 绝不逐秒回放 · dt 封顶 24h · 计算耗时 O(1)（离线 30 天 = 离线 1 小时）</div>
  <nav id="nsk-tabs"></nav>
  <main id="nsk-view"></main>
</div>
<div id="nsk-pop"></div>
<div id="nsk-nodepop"></div>
<aside id="nsk-activity"></aside>

<!-- 设置 / 存档面板 -->
<div id="nsk-settings" class="nsk-overlay">
  <div class="nsk-panel">
    <div class="nsk-panel-head">设置 · 存档 <button id="nsk-settings-close" class="nsk-x" aria-label="关闭">✕</button></div>
    <div class="nsk-cloud-status" id="nsk-cloud-status">云存档：检测中…</div>
    <div class="nsk-row">
      <button id="nsk-export-code" class="sm">生成存档码</button>
      <button id="nsk-copy-code" class="sm" disabled>复制存档码</button>
    </div>
    <textarea id="nsk-code-area" class="nsk-code" placeholder="存档码 / 存档文本（NSK1. / NSK1P. / NSK2. / 信封JSON）" readonly></textarea>
    <div class="nsk-row">
      <button id="nsk-import-code" class="sm" disabled>导入上方存档码</button>
    </div>
    <div class="nsk-row">
      <button id="nsk-export-file" class="sm">导出存档文件</button>
      <label class="sm file-btn">导入存档文件<input type="file" id="nsk-import-file" accept=".json,.txt,application/json" hidden></label>
    </div>
    <div class="nsk-row danger-row">
      <button id="nsk-delete-save" class="sm danger-btn">删除本机存档</button>
    </div>
    <div class="nsk-hint" id="nsk-settings-hint"></div>
  </div>
</div>

<!-- 启动存档冲突弹窗（本地 vs 云端） -->
<div id="nsk-cloud-conflict" class="nsk-overlay">
  <div class="nsk-panel">
    <div class="nsk-panel-head">存档冲突</div>
    <div class="nsk-conflict-body" id="nsk-conflict-body"></div>
    <div class="nsk-row">
      <button id="nsk-conflict-local" class="sm">保留本机</button>
      <button id="nsk-conflict-cloud" class="sm primary">使用云端</button>
    </div>
  </div>
</div>

<!-- Core 层 -->
<script src="js/core/rng.js?v=11"></script>
<script src="js/core/codec.js?v=1"></script>
<script src="js/core/storage.js?v=1"></script>
<script src="js/core/store.js?v=22"></script>
<script src="js/core/save-envelope.js?v=1"></script>
<script src="js/core/cloud-save-contract.js?v=1"></script>
<script src="js/core/cloud-providers.js?v=1"></script>
<script src="js/core/cloud-save-service.js?v=1"></script>
<script src="js/core/persistence.js?v=1"></script>
<!-- Data 层 -->
<script src="js/data/resources.js?v=15"></script>
<script src="js/data/starmap.js?v=18"></script>
<script src="js/data/ships.js?v=17"></script>
<script src="js/data/recipes.js?v=11"></script>
<!-- ============ lib: EVE-IDLE 复用（数据+纯函数，复制进本地库，非共享） ============ -->
<!-- 加载顺序：宿主契约垫片 → 资源注册表 → 装备数据 → 强化/改装纯函数 → 纯数据表 -->
<script src="js/lib/eveidle/host-stubs.js?v=2"></script>
<script src="js/lib/eveidle/core/resources.js?v=1"></script>
<script src="js/lib/eveidle/data/display-names.js?v=1"></script>
<script src="js/lib/eveidle/data/equipment.js?v=1"></script>
<script src="js/lib/eveidle/systems/enhancement-chance.js?v=1"></script>
<script src="js/lib/eveidle/systems/equipment-enhancement.js?v=1"></script>
<script src="js/lib/eveidle/systems/rigs.js?v=1"></script>
<script src="js/lib/eveidle/systems/ship-enhancement.js?v=1"></script>
<script src="js/lib/eveidle/data/ammunition.js?v=1"></script>
<script src="js/lib/eveidle/data/cargo.js?v=1"></script>
<script src="js/lib/eveidle/data/boosters.js?v=1"></script>
<script src="js/lib/eveidle/data/implants.js?v=1"></script>
<script src="js/lib/eveidle/data/ammo.js?v=1"></script>
<script src="js/data/factions.js?v=15"></script>
<script src="js/data/names.js?v=11"></script>
<!-- Engine 层（无 DOM 依赖） -->
<script src="js/engine/state.js?v=21"></script>
<script src="js/engine/recruit.js?v=2"></script>
<script src="js/engine/base.js?v=2"></script>
<script src="js/engine/dispatch.js?v=17"></script>
<script src="js/engine/npc.js?v=2"></script>
<script src="js/engine/booster.js?v=1"></script>
<script src="js/engine/mastery.js?v=1"></script>
<script src="js/engine/production.js?v=13"></script>
<script src="js/engine/faction.js?v=14"></script>
  <script src="js/engine/combat.js?v=15"></script>
  <script src="js/engine/logistics.js?v=2"></script>
  <script src="js/engine/sites.js?v=1"></script>
<!-- Narrative 层（零 API，静态事件库，须先于 settle 加载） -->
<script src="js/narrative/events.js?v=17"></script>
<!-- 剧情：数据（story.js 由 story-editor.html 生成）+ 运行时（播放状态机/头像解析/分支） -->
<script src="js/narrative/story.js?v=1"></script>
<script src="js/narrative/story-runtime.js?v=1"></script>
<script src="js/engine/settle.js?v=24"></script>
<!-- UI 层 -->
<script src="js/ui/portraits.js?v=2"></script>
<script src="js/ui/app.js?v=64"></script>
</body>
</html>
