<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>深空星疆 · 商业与战争</title>
<link rel="stylesheet" href="css/main.css?v=107">
</head>
<body>
<div id="nsk-app">
  <header id="nsk-hud"></header>
  <div class="redline-banner">⚠️ 离线结算铁律（§14.5）：单核时间戳驱动 · 纯闭式 · 绝不逐秒回放 · dt 封顶 24h · 计算耗时 O(1)（离线 30 天 = 离线 1 小时）</div>
  <nav id="nsk-tabs"></nav>
  <main id="nsk-view"></main>
</div>
<div id="nsk-pop"></div>
<div id="nsk-nodepop"></div>
<aside id="nsk-activity"></aside>

<!-- 设置 / 存档面板 -->
<div id="nsk-settings" class="nsk-overlay">
  <div class="nsk-panel">
    <div class="nsk-panel-head">设置 · 存档 <button id="nsk-settings-close" class="nsk-x" aria-label="关闭">✕</button></div>
    <div class="nsk-cloud-status" id="nsk-cloud-status">云存档：检测中…</div>
    <div class="nsk-row">
      <button id="nsk-export-code" class="sm">生成存档码</button>
      <button id="nsk-copy-code" class="sm" disabled>复制存档码</button>
    </div>
    <textarea id="nsk-code-area" class="nsk-code" placeholder="存档码 / 存档文本（NSK1. / NSK1P. / NSK2. / 信封JSON）" readonly></textarea>
    <div class="nsk-row">
      <button id="nsk-import-code" class="sm" disabled>导入上方存档码</button>
    </div>
    <div class="nsk-row">
      <button id="nsk-export-file" class="sm">导出存档文件</button>
      <label class="sm file-btn">导入存档文件<input type="file" id="nsk-import-file" accept=".json,.txt,application/json" hidden></label>
    </div>
    <div class="nsk-row danger-row">
      <button id="nsk-delete-save" class="sm danger-btn">删除本机存档</button>
    </div>
    <div class="nsk-hint" id="nsk-settings-hint"></div>
  </div>
</div>

<!-- ===== 舰船装配 · 环带弹窗（移植 1 代 openEquipOrbit，2026-11-01 从成员档案迁入舰队页） =====
     结构照搬 1 代 index.html 的 #equipOrbitModal：环带总览 + 点槽位浮出候选面板 +
     已装装备条 + 四格统计。差异：去掉强化的「详情」入口、改装件谐振、泰坦末日槽、
     精炼泵管路接口（本作没有这些子系统）；主题色由 1 代金黄改为本作青蓝。 -->
<div class="fo-overlay" id="fitOrbitModal" aria-hidden="true">
  <div class="fo-modal" role="dialog" aria-modal="true" aria-label="舰船装配">
    <button class="fo-close" id="fitOrbitClose" aria-label="关闭">✕</button>
    <div class="fo-title" id="fitOrbitTitle">舰船装配</div>
    <div class="fo-sub" id="fitOrbitSub">—</div>
    <div class="fo-orbit" id="fitOrbitWrapper">
      <svg viewBox="0 0 500 500" id="fitOrbitSvg" aria-label="装配环"></svg>
      <div class="fo-panel" id="fitOrbitPanel">
        <div class="fo-panel-head">
          <span class="fo-panel-title" id="fitOrbitPanelTitle">选择装备</span>
          <button class="fo-panel-x" id="fitOrbitPanelClose" aria-label="收起">✕</button>
        </div>
        <div id="fitOrbitOptions"></div>
      </div>
    </div>
    <div class="fo-lib">
      <div class="fo-lib-title">已装配装备</div>
      <div class="fo-lib-items" id="fitOrbitLib"></div>
    </div>
    <div class="fo-stats" id="fitOrbitStats">
      <div class="fo-stat"><span>护盾</span><b class="shield" id="foStatShield">—</b></div>
      <div class="fo-stat"><span>装甲</span><b class="armor" id="foStatArmor">—</b></div>
      <div class="fo-stat"><span>结构</span><b class="hull" id="foStatHull">—</b></div>
      <div class="fo-stat"><span>回避</span><b class="dodge" id="foStatDodge">—</b></div>
    </div>
    <div class="fo-actions">
      <button class="sm ghost" id="fitOrbitClear">清空全部</button>
      <button class="sm" id="fitOrbitDone">完成</button>
    </div>
  </div>
</div>

<!-- 增强剂槽位装载选择器（舰基页「增幅剂」面板调用） -->
<div class="bm-overlay" id="nsk-booster-picker" aria-hidden="true">
  <div class="bm-box" role="dialog" aria-modal="true" aria-label="装载增强剂">
    <div class="bm-title" id="bp-title">装载增强剂</div>
    <div class="bm-res bp-list" id="bp-list"></div>
    <div class="bm-actions">
      <button class="sm ghost" id="bp-cancel" type="button">取消</button>
    </div>
  </div>
</div>

<!-- 启动存档冲突弹窗（本地 vs 云端） -->
<div id="nsk-cloud-conflict" class="nsk-overlay">
  <div class="nsk-panel">
    <div class="nsk-panel-head">存档冲突</div>
    <div class="nsk-conflict-body" id="nsk-conflict-body"></div>
    <div class="nsk-row">
      <button id="nsk-conflict-local" class="sm">保留本机</button>
      <button id="nsk-conflict-cloud" class="sm primary">使用云端</button>
    </div>
  </div>
</div>
