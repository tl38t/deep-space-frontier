<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>story-editor selftest</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:1600px;height:900px;border:1px solid #ccc"></iframe>
<script>
// 剧情编辑器自测（真实打开 story-editor.html，驱动真实 DOM）
//   场景1 装载：从 story.js 读出现有剧情（**场景/台词/选项数一律从源数据推导**，不写死）
//   场景2 导出往返：点「预览 story.js」→ 解析生成的代码 → 与源数据深度一致（不丢字段）
//   场景3 编辑：改正文 → 预览同步 + 草稿落 localStorage
//   场景4 结构：加一句 / 删一句 / 加场景 / 删场景，计数同步
//   场景5 选项：改跳转目标 + 资源数量 → 导出的 effect 正确
//   场景6 校验：能报出「未定义说话人」「悬空跳转」「缺图」
//   场景7 回读：把导出的 story.js 文本塞回去，还原出同样的场景表
const out=[]; let PASS=0, FAIL=0;
const log=(s)=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(name,cond,extra)=>{ cond?PASS++:FAIL++; log((cond?"[PASS] ":"[FAIL] ")+name+(extra!==undefined?("  → "+extra):"")); };
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr");
async function until(fn,ms,step){ ms=ms||8000; step=step||80; const t0=Date.now();
  while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(step); } return false; }

const D=()=>fr.contentDocument, W=()=>fr.contentWindow;
// ⚠ 用 createEvent+initEvent：`new W().Event(...)` 会被解析成 new (W())，而 W 是箭头函数不能 new
const Ev=(type)=>{ const e=D().createEvent("Event"); e.initEvent(type,true,false); return e; };
const q=(s)=>D().querySelector(s);
const qa=(s)=>Array.from(D().querySelectorAll(s));
const txt=(el)=>el?el.textContent.trim():"";
const val=(s)=>{ const e=q(s); return e?e.value:null; };
function setVal(sel,v){
  const e=q(sel); if(!e) return false;
  e.value=v;
  e.dispatchEvent(Ev("input"));
  return true;
}
function setSelVal(sel,v){
  const e=q(sel); if(!e) return false;
  e.value=v;
  e.dispatchEvent(Ev("change"));
  return true;
}
function click(sel){ const e=q(sel); if(!e) return false; e.click(); return true; }
// 在隔离环境里求值生成的 story.js，取回数据对象
function evalStory(code){
  const moduleObj={exports:{}};
  const fakeWin={NSK:{}};
  new Function("window","module","self",code)(fakeWin,moduleObj,{});
  return moduleObj.exports;
}
// 规范化序列化：对象键排序后再 stringify。
// 为什么需要：编辑器重建 effect 时按键序 delta→flag→special 写入，源数据声明顺序可能不同，
// 直接 JSON.stringify 比较会因**键序**判不等，报出「导出丢了字段」这种并不存在的故障。
// 数组顺序保持原样（数组顺序本身有语义）。
function canon(v){
  return JSON.stringify(v,(k,val)=>{
    if(val && typeof val==="object" && !Array.isArray(val)){
      const o={}; for(const kk of Object.keys(val).sort()) o[kk]=val[kk]; return o;
    }
    return val;
  });
}

(async function(){
  fr.src="../story-editor.html";
  const ready=await until(()=>{ const d=D(); return d && d.querySelector("#hdStat"); },15000);
  ok("编辑器启动完成", ready);
  if(!ready){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  await wait(300);

  // 期望值一律**从源数据推导**，不写死数字。
  // 历史教训：这些断言原先把「4 场景 / 22 台词 / 2 隐藏 / 5 张卡 / 2 个选项」全写成字面量，
  // 剧情从 4 场景扩到 6 场景后它们集体假红 —— 页面本身没坏，是断言把当时的快照当成了真理。
  const SRC=W().NSK_STORY;
  const N_SCENES=SRC.scenes.length;
  const N_HIDDEN=SRC.scenes.filter(s=>s.hidden).length;
  const N_SPK_COUNT=Object.keys(SRC.speakers||{}).length;
  const FIRST=SRC.scenes[0];
  const N_FIRST_LINES=(FIRST.lines||[]).length;
  const FIRST_CHOICE_LINE=(FIRST.lines||[]).find(l=>l.choices&&l.choices.length);
  const N_FIRST_CHOICES=FIRST_CHOICE_LINE?FIRST_CHOICE_LINE.choices.length:0;

  // ---------- 场景1：装载 ----------
  ok("读入源数据的场景数（"+N_SCENES+"）", qa("[data-scene]").length===N_SCENES, "实际 "+qa("[data-scene]").length);
  ok("统计头显示 "+N_SCENES+" 场景与源数据一致", new RegExp("^"+N_SCENES+" 场景 · ").test(txt(q("#hdStat"))), txt(q("#hdStat")));
  ok("说话人表读入 "+N_SPK_COUNT+" 条", qa("[data-sp-name]").length===N_SPK_COUNT, "实际 "+qa("[data-sp-name]").length);
  ok("首场景台词卡 "+N_FIRST_LINES+" 张", qa(".line-card").length===N_FIRST_LINES, "实际 "+qa(".line-card").length);
  ok("选项句渲染出 "+N_FIRST_CHOICES+" 个选项框", qa(".choice-box").length===N_FIRST_CHOICES, "实际 "+qa(".choice-box").length);
  ok("开局自动场景有标记", /开局自动/.test(txt(q("[data-scene]"))), txt(q("[data-scene]")).slice(0,20));

  // ---------- 场景2：导出往返（关键） ----------
  click("#btnPreviewJs"); await wait(120);
  const gen=q("#modalText")?q("#modalText").value:"";
  ok("导出内容非空", gen.length>500, gen.length+" 字符");
  ok("导出含 UMD 包裹（挂 NSK_STORY）", /window\.NSK_STORY\s*=\s*mod/.test(gen));
  ok("导出含 schema 注释头", /schema：/.test(gen));
  let ex=null;
  try{ ex=evalStory(gen); }catch(e){ ex=null; }
  ok("导出的代码可求值", !!ex && Array.isArray(ex.scenes), ex?("场景 "+ex.scenes.length):"eval 失败");
  const src=W().NSK_STORY;
  if(ex && src){
    ok("场景数与原数据一致", ex.scenes.length===src.scenes.length, ex.scenes.length+" vs "+src.scenes.length);
    ok("场景 id 序列一致", JSON.stringify(ex.scenes.map(s=>s.id))===JSON.stringify(src.scenes.map(s=>s.id)));
    ok("台词总数一致", JSON.stringify(ex.scenes.map(s=>s.lines.length))===JSON.stringify(src.scenes.map(s=>s.lines.length)),
      JSON.stringify(ex.scenes.map(s=>s.lines.length)));
    ok("trigger 保留（firstBoot 只有一个）", ex.scenes.filter(s=>s.trigger==="firstBoot").length===1);
    ok("hidden 保留（源数据 "+N_HIDDEN+" 个隐藏支线）", ex.scenes.filter(s=>s.hidden).length===N_HIDDEN, ""+ex.scenes.filter(s=>s.hidden).length);
    ok("选项 next 全部保留", ex.scenes.every((s,i)=>s.lines.every((l,li)=>{
      const a=(l.choices||[]).map(c=>c.next||null), b=((src.scenes[i].lines[li]||{}).choices||[]).map(c=>c.next||null);
      return JSON.stringify(a)===JSON.stringify(b);
    })));
    ok("选项 effect 全部保留", canon(ex.scenes.map(s=>s.lines.map(l=>(l.choices||[]).map(c=>c.effect||null))))
      === canon(src.scenes.map(s=>s.lines.map(l=>(l.choices||[]).map(c=>c.effect||null)))),
      canon((ex.scenes[0].lines.find(l=>l.choices&&l.choices.length)||{choices:[]}).choices.map(c=>c.effect||null)));
    ok("speakers 全部保留（含颜色）", JSON.stringify(ex.speakers)===JSON.stringify(src.speakers),
      Object.keys(ex.speakers).join(","));
    ok("fx:holo 保留", (ex.speakers.flora||{}).fx==="holo", JSON.stringify(ex.speakers.flora));
  } else { ok("往返比对（数据缺失，跳过）", false); }
  click("#modalClose"); await wait(80);

  // ---------- 场景3：编辑正文 ----------
  const ta=q('[data-text="0"]');
  ok("第一张卡有正文输入框", !!ta);
  const orig=ta.value;
  ta.value="【测试】改过的旁白。";
  ta.dispatchEvent(Ev("input"));
  await wait(80);
  ok("预览随正文同步", /【测试】改过的旁白/.test(txt(q(".pv .dlg-text"))), txt(q(".pv .dlg-text")).slice(0,14));
  ok("草稿已写 localStorage", (function(){
    try{ return /【测试】/.test(D().defaultView.localStorage.getItem("nsk_story_editor_draft_v1")||""); }catch(e){ return false; }
  })());
  ta.value=orig; ta.dispatchEvent(Ev("input")); await wait(60);

  // ---------- 场景4：结构增删 ----------
  const before=qa(".line-card").length;
  click("#btnAddLine"); await wait(150);
  ok("加一句后卡片 +1", qa(".line-card").length===before+1, before+" → "+qa(".line-card").length);
  click('[data-del="'+(before)+'"]'); await wait(150);
  ok("删那句后卡片回到原数", qa(".line-card").length===before, "实际 "+qa(".line-card").length);
  const scBefore=qa("[data-scene]").length;
  click("#btnAddScene"); await wait(200);
  ok("新建场景 +1", qa("[data-scene]").length===scBefore+1, scBefore+" → "+qa("[data-scene]").length);
  W().confirm=()=>true;
  click("#scDel"); await wait(200);
  ok("删场景回到原数", qa("[data-scene]").length===scBefore, "实际 "+qa("[data-scene]").length);

  // ---------- 场景5：选项多资源效果（不能互相冲掉） ----------
  // 目标位置**动态找**：找「同一个选项带 ≥2 条非零资源」的那一条。
  // 旧版把 `data-scene="2"` / `data-ch-res^="6:0:"` / credits:300+fuel:20 / flag=prologue_done
  // 全写死，剧情一扩写（4→6 场景、台词重排）就全漂了 —— 页面没坏，是断言钉住了旧快照。
  let DR=null;
  for(let si=0;si<SRC.scenes.length && !DR;si++){
    const L=SRC.scenes[si].lines||[];
    for(let li=0;li<L.length && !DR;li++){
      const CH=L[li].choices||[];
      for(let ci=0;ci<CH.length;ci++){
        const d=(CH[ci].effect||{}).delta||{};
        const ks=Object.keys(d).filter(k=>Number(d[k]));
        if(ks.length>=2){ DR={si,li,ci,ks,vals:ks.map(k=>Number(d[k])),flag:(CH[ci].effect||{}).flag}; break; }
      }
    }
  }
  ok("源数据里存在双资源选项（后续断言的前提）", !!DR, DR?("场景"+DR.si+" 台词"+DR.li+" 选项"+DR.ci+" 资源 "+DR.ks.join("/")):"未找到");
  if(DR){
    const sc3=q('[data-scene="'+DR.si+'"]'); ok("能切到目标场景", !!sc3); if(sc3){ sc3.click(); }
    await wait(250);
    const pre=DR.li+":"+DR.ci+":";
    const rows=qa('[data-ch-res^="'+pre+'"]');
    ok("双资源选项渲染出 "+DR.ks.length+" 行资源", rows.length===DR.ks.length, "行数 "+rows.length);
    const num=q('[data-ch-qty="'+pre+'0"]'), num2=q('[data-ch-qty="'+pre+'1"]');
    ok("两行的数量都对（"+DR.vals[0]+" / "+DR.vals[1]+"）", num && num.value===String(DR.vals[0]) && num2 && num2.value===String(DR.vals[1]),
      (num?num.value:"?")+" / "+(num2?num2.value:"?"));
    function exportNow(){
      click("#btnPreviewJs");
      let out=null;
      try{ out=evalStory(q("#modalText").value); }catch(e){}
      click("#modalClose");
      return out;
    }
    const effOf=(st)=>{ const s=((st||{}).scenes||[])[DR.si]||{lines:[]}; return ((s.lines[DR.li]||{choices:[]}).choices[DR.ci]||{}).effect||{}; };
    if(num){
      num.value="500"; num.dispatchEvent(Ev("input"));
      await wait(150);
      const d1=(effOf(exportNow()).delta)||{};
      ok("改第 1 行数量生效（"+DR.ks[0]+" 500）", d1[DR.ks[0]]===500, JSON.stringify(d1));
      ok("第 2 行 "+DR.ks[1]+" 没被冲掉（仍 "+DR.vals[1]+"）", d1[DR.ks[1]]===DR.vals[1], JSON.stringify(d1));
    }
    if(rows[1]){
      rows[1].value="rep"; rows[1].dispatchEvent(Ev("change"));
      await wait(200);
      const e2=exportNow(); const d2=(effOf(e2).delta)||{};
      ok("改第 2 行资源键生效（→rep，数值保留 "+DR.vals[1]+"）", d2.rep===DR.vals[1] && d2[DR.ks[1]]===undefined, JSON.stringify(d2));
      ok("第 1 行 "+DR.ks[0]+" 500 仍在", d2[DR.ks[0]]===500, JSON.stringify(d2));
      if(DR.flag) ok("flag 未被资源操作误删（"+DR.flag+"）", effOf(e2).flag===DR.flag, JSON.stringify(effOf(e2)));
    }
  }

  // ---------- 场景6：校验 ----------
  // 「必须报缺图」是错的断言：缺图取决于磁盘上有没有图，剧情数据一改就可能全部有图。
  // 正确做法是**注入一个必然缺图的头像**，验证校验器真的能发现它，然后还原。
  click("#btnValidate"); await wait(200);
  const iss=txt(q("#issueBox"));
  ok("校验框有输出", iss.length>0, iss.slice(0,40));
  const avIn=q("[data-sp-av]");
  if(!avIn){ ok("存在说话人头像输入框（缺图注入的前提）", false); }
  else{
    const spKey=avIn.getAttribute("data-sp-av"), avOld=avIn.value;
    avIn.value="guides/__definitely_missing__.webp";
    avIn.dispatchEvent(Ev("input"));
    await wait(200);
    click("#btnValidate"); await wait(250);
    const iss2=txt(q("#issueBox"));
    ok("校验能报出注入的缺图", /缺图/.test(iss2), iss2.slice(0,70));
    avIn.value=avOld; avIn.dispatchEvent(Ev("input"));
    await wait(200);
    click("#btnValidate"); await wait(250);
    ok("还源头像后缺图消失", !/缺图/.test(txt(q("#issueBox"))), txt(q("#issueBox")).slice(0,50));
  }

  // ---------- 场景7：回读导出的文本 ----------
  click("#btnPreviewJs"); await wait(120);
  const gen2=q("#modalText").value;
  click("#modalClose"); await wait(60);
  // 通过文件输入通道回读
  const file=new (W().File)([gen2],"story.js",{type:"text/javascript"});
  const dt=new (W().DataTransfer)(); dt.items.add(file);
  const fi=q("#fileIn"); fi.files=dt.files;
  fi.dispatchEvent(Ev("change"));
  await until(()=>qa("[data-scene]").length===N_SCENES,4000);
  ok("回读后场景数还原（"+N_SCENES+"）", qa("[data-scene]").length===N_SCENES, "实际 "+qa("[data-scene]").length);
  ok("回读后统计头一致", new RegExp("^"+N_SCENES+" 场景 · ").test(txt(q("#hdStat"))), txt(q("#hdStat")));

  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
