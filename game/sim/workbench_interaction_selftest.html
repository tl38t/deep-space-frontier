<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>舱段工作台 · 交互局部更新回归</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:430px;height:940px;border:1px solid #ccc"></iframe>
<script>
// 2026-11-13：修复「点任意按钮整面板重建 / 滚动归零」后的真实 DOM 回归。
// B：轻量变化（选配方 / 数量 / 快捷倍数 / ME·TE）只就地更新，.wb-panel 节点身份与滚动位置不变。
// A：结构性变化（切页签）仍整块重建，但 render() 必须恢复 scrollTop。
const out=[]; let PASS=0, FAIL=0;
const log=s=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(name,cond,extra)=>{ cond?PASS++:FAIL++; log((cond?"[PASS] ":"[FAIL] ")+name+(extra!==undefined?("  → "+extra):"")); };
const skip=(name,why)=>{ log("[SKIP] "+name+"  → "+why); };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr");
const D=()=>fr.contentDocument, W=()=>fr.contentWindow;
const q=s=>{ try{ return D().querySelector(s); }catch(e){ return null; } };
const qa=s=>{ try{ return [...D().querySelectorAll(s)]; }catch(e){ return []; } };
async function until(fn,ms){ ms=ms||20000; const t0=Date.now(); while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(120); } return false; }
const click=s=>{ const el=q(s); if(el){ el.click(); return true; } return false; };
let ERRS=[];
function hookErrors(){ ERRS=[]; try{ W().addEventListener("error", e=>ERRS.push(String(e.message||e.error))); }catch(e){}
  try{ W().addEventListener("unhandledrejection", e=>ERRS.push("promise:"+String(e.reason))); }catch(e){} }
function saveKey(){ try{ return Object.keys(W().localStorage).find(k=>/^nsk_save/i.test(k)); }catch(e){ return null; } }

(async function(){
  fr.src="../index.html?t="+Date.now()+"#base";
  const booted=await until(()=>!!q("#nsk-tabs .tab"),25000);
  ok("游戏启动完成", booted);
  if(!booted){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  hookErrors();
  const KEY=saveKey(); const BACKUP=KEY?W().localStorage.getItem(KEY):null;
  await wait(400);
  click('[data-act="tab:base"]'); await wait(700);
  await until(()=>qa(".base-module").length>0,10000);

  // ---------- B：精炼环，轻量交互 ----------
  const sm=q("button.base-smelt");
  ok("找到精炼环卡片", !!sm);
  if(sm) sm.click();
  const opened=await until(()=>!!q(".wb-overlay.active"),8000);
  ok("精炼环工作台已打开", opened);
  if(!opened){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }

  const p0=q(".wb-panel");
  const maxScroll=p0.scrollHeight-p0.clientHeight;
  ok("面板内容可滚动", maxScroll>280, "maxScroll="+maxScroll);
  const TOP=Math.min(280,Math.max(0,maxScroll-1));
  p0.scrollTop=TOP;
  const cap0=(q(".wb-cap")||{}).textContent||"";
  const add0=(q(".wb-add")||{}).textContent||"";

  // ---------- 窄屏（430px 视口）：两栏 wrapper 摊平后，上下顺序必须还原 ----------
  const cs0=(el,prop)=>{ try{ return W().getComputedStyle(el)[prop]; }catch(e){ return ""; } };
  ok("[窄屏] 两栏 wrapper 已摊平为 contents",
      cs0(q(".wb-col-left"),"display")==="contents" && cs0(q(".wb-col-right"),"display")==="contents");
  ok("[窄屏] panel 走纵向 flex", cs0(p0,"display")==="flex", cs0(p0,"display"));
  const tDetail=(q(".wb-detail")||{}).getBoundingClientRect().top;
  const tRecipes=(q(".wb-recipes")||{}).getBoundingClientRect().top;
  const tQueue=(q(".wb-queue-sec")||{}).getBoundingClientRect().top;
  ok("[窄屏] 顺序：舱段明细 → 配方 → 队列", tDetail<tRecipes && tRecipes<tQueue,
      "detail="+Math.round(tDetail)+" recipes="+Math.round(tRecipes)+" queue="+Math.round(tQueue));
  ok("[窄屏] 配方网格未被 flex 压扁",
      qa(".wb-recipe").filter(el=>el.scrollHeight>el.clientHeight+2).length===0);

  const cards=qa(".wb-recipe");
  ok("精炼配方卡渲染（≥2）", cards.length>=2, cards.length);
  const target=cards[1]||cards[0];
  const firstCardNode=q(".wb-recipe");
  target.click(); await wait(160);
  const p1=q(".wb-panel");
  ok("[B·选配方] 面板节点未被替换", p0===p1);
  ok("[B·选配方] 滚动位置保持", p1.scrollTop===TOP, "before="+TOP+" after="+p1.scrollTop);
  ok("[B·选配方] 首张配方卡节点身份保持", q(".wb-recipe")===firstCardNode);
  ok("[B·选配方] 选中态只落在被点卡片", target.classList.contains("sel") && qa(".wb-recipe.sel").length===1,
      "sel="+qa(".wb-recipe.sel").length);
  const add1=(q(".wb-add")||{}).textContent||"";
  ok("[B·选配方] 加按钮文案已同步", add1!==add0 && !/未选择/.test(add1), add1);
  ok("[B·选配方] 可产批数提示已同步", ((q(".wb-cap")||{}).textContent||"")!==cap0);

  // 跨 1Hz 刷新周期：refresh() 不得把 patch 的结果冲掉
  await wait(2400);
  ok("[跨周期] 面板节点仍未被替换", q(".wb-panel")===p1);
  ok("[跨周期] 滚动位置仍保持", q(".wb-panel").scrollTop===TOP, "after="+q(".wb-panel").scrollTop);
  ok("[跨周期] 选中态仍保持", qa(".wb-recipe.sel").length===1);

  p1.scrollTop=TOP;
  click('.wb-step[data-act="workbench:count:1"]'); await wait(140);
  ok("[B·数量+] 面板节点未被替换", q(".wb-panel")===p1);
  ok("[B·数量+] 滚动位置保持", q(".wb-panel").scrollTop===TOP, "after="+q(".wb-panel").scrollTop);
  ok("[B·数量+] 计数显示为 2", ((q(".wb-count")||{}).textContent||"").trim()==="2", (q(".wb-count")||{}).textContent);

  click('.wb-chip[data-act="workbench:chip:10"]'); await wait(140);
  ok("[B·×10] 面板节点未被替换", q(".wb-panel")===p1);
  ok("[B·×10] 滚动位置保持", q(".wb-panel").scrollTop===TOP, "after="+q(".wb-panel").scrollTop);
  ok("[B·×10] 计数显示为 10", ((q(".wb-count")||{}).textContent||"").trim()==="10", (q(".wb-count")||{}).textContent);

  // ---------- A：结构性变化仍重建，但滚动位置须恢复 ----------
  click(".wb-close"); await wait(200);
  const mf=q("button.base-manufacture");
  if(mf && !mf.classList.contains("empty")){
    mf.click();
    const opened2=await until(()=>!!q(".wb-overlay.active"),5000);
    ok("总装船坞工作台已打开", opened2);
    if(opened2){
      const pA=q(".wb-panel");
      const maxA=pA.scrollHeight-pA.clientHeight;
      const TOPA=Math.min(200,Math.max(0,maxA-1));
      pA.scrollTop=TOPA;
      click('[data-act="workbench:tab:ship"]'); await wait(220);
      const pB=q(".wb-panel");
      const maxB=pB.scrollHeight-pB.clientHeight;
      const expect=Math.min(TOPA,Math.max(0,maxB));
      ok("[A·切页签] 结构性变化确实整块重画", pA!==pB);
      ok("[A·切页签] 滚动位置已恢复（非归零）", TOPA>0 && Math.abs(pB.scrollTop-expect)<=2,
          "before="+TOPA+" after="+pB.scrollTop+" expect="+expect);
      const onTab=q(".wb-tabs .wb-tab.on");
      ok("[A·切页签] 页签高亮正确", !!onTab && /造船/.test(onTab.textContent), onTab?onTab.textContent:"null");
      ok("[A·切页签] 造船配方卡已渲染", qa(".wb-recipe").length>=1, qa(".wb-recipe").length);
    }
  } else skip("总装船坞页签回归", "总装船坞未装配");

  // ---------- 研究页：选蓝图不重建搜索框 ----------
  click(".wb-close"); await wait(150);
  const iv=q("button.base-invent");
  if(iv && !iv.classList.contains("empty")){
    iv.click();
    const opened3=await until(()=>!!q(".wb-overlay.active"),5000);
    if(opened3 && q(".wb-recipe.iv-bp")){
      const pI=q(".wb-panel"), inp=q("#ivq");
      const maxI=pI.scrollHeight-pI.clientHeight;
      const TOPI=Math.min(180,Math.max(0,maxI-1));
      pI.scrollTop=TOPI;
      const bp=q(".wb-recipe.iv-bp");
      const bpName=(q(".iv-bp-name")||{}).textContent||"";
      bp.click(); await wait(180);
      ok("[B·研究页] 面板节点未被替换", q(".wb-panel")===pI);
      ok("[B·研究页] 滚动位置保持", q(".wb-panel").scrollTop===TOPI, "after="+q(".wb-panel").scrollTop);
      ok("[B·研究页] 搜索框节点身份保持（焦点不丢）", q("#ivq")===inp);
      const h3=q(".wb-study-detail .iv-detail h3");
      ok("[B·研究页] 详情块已就地更新", !!h3 && h3.textContent===bpName, h3?h3.textContent:"null");
      click('[data-act="workbench:sdir:te"]'); await wait(160);
      ok("[B·ME/TE] 面板节点未被替换", q(".wb-panel")===pI);
      ok("[B·ME/TE] 方向高亮已切换", !!q('.iv-dir span[data-act="workbench:sdir:te"].on'));
      ok("[B·ME/TE] 加按钮文案含时间效率", /时间效率/.test((q(".wb-add")||{}).textContent||""), (q(".wb-add")||{}).textContent);
    } else skip("研究页局部更新回归", "发明舱未装配或蓝图未就绪");
  } else skip("研究页局部更新回归", "发明舱未装配");

  click(".wb-close"); await wait(150);
  ok("关闭后弹窗消失", q(".wb-overlay.active")===null);
  ok("全程无未捕获错误", ERRS.length===0, ERRS.slice(0,3).join(" | ")||"无");

  if(KEY && BACKUP!==null){ try{ W().localStorage.setItem(KEY,BACKUP); log("[i] 已还原存档备份"); }catch(e){} }
  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
