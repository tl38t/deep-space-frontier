<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>volley-combat selftest</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:1240px;height:940px;border:1px solid #ccc"></iframe>
<script>
// 齐射战斗面板真机自测（真实打开 index.html，用真实 DOM 点击驱动）
//   1 游戏启动
//   2 成员页点「战斗」派遣 → 该成员 assignment.type = combat
//   3 切星系页 → 战斗观测面板出现
//   4 面板含 3 艘敌舰卡 + 敌我双方三防血条 + 本场累计
//   5 等一段时间 → 编队血条按波内进度下降（证明进度真的在推进）
const out=[]; let PASS=0, FAIL=0;
const log=(s)=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(name,cond,extra)=>{ cond?PASS++:FAIL++; log((cond?"[PASS] ":"[FAIL] ")+name+(extra!==undefined?("  → "+extra):"")); };
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr");
async function until(fn,ms,step){ ms=ms||20000; step=step||150; const t0=Date.now();
  while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(step); } return false; }
const D=()=>fr.contentDocument;
const q=(sel)=>D().querySelector(sel);
const qa=(sel)=>D().querySelectorAll(sel);
const txt=(el)=>el?el.textContent.trim():"";
// 精准导航：只改 src 后旧文档仍在，until("#nsk-tabs .tab") 会立刻在旧文档上返回 true →
// 后续 click/读数全落在被销毁的旧 DOM 上（曾导致「我方火力 0/s」的假故障）。必须等 onload。
const nav=(url)=>new Promise((res)=>{ fr.onload=()=>{ fr.onload=null; res(); }; fr.src=url; });

(async function(){
  await nav("../index.html#members");
  const booted=await until(()=>{ const d=D(); return d && d.querySelector("#nsk-tabs .tab"); },25000);
  ok("游戏启动完成", booted);
  if(!booted){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }

  // 1.5) 种存档：全员配一把激光（1 代规则 —— 没有武器就没有伤害，零火力时波时长根本不存在）
  const W=()=>fr.contentWindow;
  const hasCore=await until(()=>W().NSK && W().NSK.Core && W().NSK.Core.load && W().NSK.Core.save, 15000);
  if(hasCore){
    const st=W().NSK.Core.load();
    st.equipment={};                       // 装备拥有清单也要登记，否则装配等于悬空引用
    for(const mm of st.members){
      mm.fitted={high:["t1_small_laser"],mid:[],low:[],rig:[]};
      st.equipment["t1_small_laser"]=(st.equipment["t1_small_laser"]||0)+1;
    }
    st.res.ammo_laser=20000;
    W().NSK.Core.save(st);
  }
  ok("种入「全员配激光」存档", hasCore);
  await wait(800);   // 存档是异步 write-through，立刻重载会读到旧档（弹药仍是默认 497）
  // 强制真实重载（只改 hash 不会重载文档）；等 onload，避免在旧文档上继续操作
  await nav("../index.html?seed="+Date.now()+"#members");
  const booted2=await until(()=>{ const d=D(); return d && d.querySelector("#nsk-tabs .tab"); },25000);
  ok("重载后游戏启动", booted2);
  if(!booted2){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  try{
    const W3=W(); const D3=W3.NSK.Data;
    const chk=W3.NSK.Core.load();
    const f=chk.members[0].fitted;
    ok("重载后存档仍保留装配", !!(f&&f.high&&f.high.length), JSON.stringify(f)+" ammo="+chk.res.ammo_laser);
    ok("诊断:装备表可查", !!(D3.Equipment&&D3.Equipment.byId("t1_small_laser")&&D3.Equipment.byId("t1_small_laser").combat),
      D3.Equipment&&D3.Equipment.byId("t1_small_laser")?JSON.stringify(D3.Equipment.byId("t1_small_laser").combat):"null");
  }catch(e){ ok("重载后存档仍保留装配", false, "err="+e.message); }

  // 钩子：记录 settle 拿到的真实 state（定位「火力为什么 0」）
  try{
    const W4=W(); const S4=W4.NSK.Engine.Settle;
    if(S4 && S4.settle && !S4.__hooked){
      const orig=S4.settle;
      S4.settle=function(st,now){
        try{
          const ms=(st.members||[]).filter(x=>x.assignment&&x.assignment.type==="combat");
          W4.__dbg={ cnt:ms.length, baseNode:String(st.base&&st.base.nodeId),
            fit:ms[0]?JSON.stringify(ms[0].fitted):"-",
            eq:st.equipment?String(st.equipment["t1_small_laser"]):"-",
            ammo:String(st.res&&st.res.ammo_laser) };
        }catch(e){}
        return orig.apply(this,arguments);
      };
      S4.__hooked=true;
    }
  }catch(e){}

  // 2) 成员页点「战斗」按钮（派遣到当前星系）
  //    必须全员上：1 代规则下 1 人 1 炮的输出打不穿 3 舰编队，单人会先被清场，
  //    永远不会出现「第 1 波」——测波数增长就成了测不到的东西。
  const btn=await (async()=>{ await until(()=>D().querySelector('[data-act$=":combat"]'),8000);
    return D().querySelector('[data-act$=":combat"]'); })();
  ok("成员页有「战斗」派遣按钮", !!btn, btn?txt(btn):"missing");
  if(!btn){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  const before=qa('[data-act$=":combat"]').length;
  for(let i=0;i<24;i++){
    const b=D().querySelector('[data-act$=":combat"]');
    if(!b) break;
    b.click();
    await wait(220);
  }
  const after=qa('[data-act$=":combat"]').length;
  ok("点击战斗后成员已全员派遣（可派遣数归零）", after===0 && before>0, before+" → "+after);

  // 3) 切到星系页
  const sysTab=D().querySelector('[data-act="tab:system"]');
  ok("星系页签存在", !!sysTab);
  if(sysTab) sysTab.click();

  const panelThere=await until(()=>D().querySelector(".battle-panel"),10000);
  ok("战斗观测面板出现（焦点战场）", panelThere);
  if(!panelThere){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  // 等第一次 settle 跑完（面板火力由 state.battles 提供，刚渲染时还是空的）
  const gotPower=await until(()=>{ const h=txt(q(".battle-head")); const m=h.match(/我方火力\s*(\d+)\/s/); return m&&parseInt(m[1],10)>0; }, 30000);
  ok("等待 settle 后我方火力上屏", gotPower, txt(q(".battle-head")).slice(0,80)+" dbg="+JSON.stringify(W().__dbg||null));

  // 4) 面板结构
  const enemies=qa(".battle-unit.enemy");
  ok("敌方编队渲染 3 艘敌舰卡", enemies.length===3, "count="+enemies.length);
  const kinds=qa(".battle-kind");
  ok("每艘敌舰带普通/精英/BOSS 标签", kinds.length===3, "count="+kinds.length);
  const mine=qa(".battle-side:first-child .battle-unit");
  ok("我方参战舰船卡渲染", mine.length>=1, "count="+mine.length);
  const bars=qa(".bhp");
  ok("三防血条数量 = (我方+敌方) × 3", bars.length===(mine.length+enemies.length)*3, "bars="+bars.length);
  ok("存在当前目标高亮", qa(".battle-unit.enemy.target").length===1, "targets="+qa(".battle-unit.enemy.target").length);
  ok("底部有本场累计", txt(q(".battle-foot")).indexOf("本场累计")>=0, txt(q(".battle-foot")).slice(0,60));
  const head=txt(q(".battle-head"));
  ok("头部显示波次与一波时长", head.indexOf("波")>=0 && head.indexOf("一波")>=0, head.slice(0,70));

  // 5) 血条状态自洽：当前目标卡仍有血量（护盾可能已空，正常：先打盾再打甲最后结构）
  const targetCard=q(".battle-unit.enemy.target");
  const tBars=targetCard?Array.prototype.slice.call(targetCard.querySelectorAll(".bhp > i")):[];
  const tSum=tBars.reduce((a,el)=>a+parseFloat(el.style.width||"0"),0);
  ok("当前目标敌舰未被清场（三防合计仍有血量）", tSum>0, "三防合计 "+tSum.toFixed(0)+"%");
  const clearedCards=qa(".battle-unit.enemy.down").length;
  ok("已清场数在合法范围", clearedCards>=0 && clearedCards<=3, "down="+clearedCards);

  // 6) 波数真的会随时间增长（一波波在打，不是静态面板）
  const waveNo=()=>{ const m=txt(q(".battle-head")).match(/第\s*(\d+)\s*波/); return m?parseInt(m[1],10):-1; };
  const w0=waveNo();
  const gained=await until(()=>waveNo()>w0, 90000);
  ok("波数随时间增长（真的一波波在打）", gained, "第 "+w0+" 波 → 第 "+waveNo()+" 波");

  // 7) 焦点战场必须由「逐轮仿真」接管（否则血条只是公式算完的倒推动画）
  const simTag=await until(()=>txt(q(".battle-head")).indexOf("逐轮仿真")>=0, 8000);
  ok("焦点战场进入逐轮仿真（不是闭式倒推）", simTag, txt(q(".battle-head")).slice(0,80));

  // 8) 切走页签 → 退回闭式，且本场波数不倒退（回切不白打）
  const wBefore=txt(q(".battle-head")).match(/第\s*(\d+)\s*波/);
  const memTab=D().querySelector('[data-act="tab:members"]');
  if(memTab) memTab.click();
  await wait(1600);
  const sysTab2=D().querySelector('[data-act="tab:system"]');
  if(sysTab2) sysTab2.click();
  await wait(600);
  const wAfter=txt(q(".battle-head")).match(/第\s*(\d+)\s*波/);
  ok("切页签后本场波数不倒退（进度不丢）",
    !!wBefore && !!wAfter && parseInt(wAfter[1],10)>=parseInt(wBefore[1],10),
    (wBefore?wBefore[0]:"-")+" → "+(wAfter?wAfter[0]:"-"));

  // 供截图核验：把战斗面板滚到视口内
  const bp=q(".battle-panel"); if(bp && bp.scrollIntoView) bp.scrollIntoView({block:"center"});

  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
