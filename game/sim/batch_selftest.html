<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>batch selftest</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:1280px;height:1000px;border:1px solid #ccc"></iframe>
<script>
// 批量制造 ×N 自测（真实打开 index.html，用真实 DOM 驱动）
// 覆盖：① 引擎级 repeat 存储 + 单批扣料 + 材料不足/门禁拒绝
//       ② UI 级：三按钮命令改写 batch: / 弹窗打开 / maxhint / 输入框级 clamp / 确认级再 clamp(toast) / repeat 经 DOM 落地
// 注意：开局 bodyLevel=0 → smelt:1 / manufacture:1 槽；造船与装备制造共享那 1 个 manufacture 槽。
//       故 UI 确认流程顺序：精炼确认 → 造船冒烟(不确认) → 装备超量确认。
const out=[]; let PASS=0, FAIL=0;
const log=(s)=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(name,cond,extra)=>{ cond?PASS++:FAIL++; log((cond?"[PASS] ":"[FAIL] ")+name+(extra!==undefined?("  → "+extra):"")); };
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr");
async function until(fn,ms,step){ ms=ms||25000; step=step||120; const t0=Date.now();
  while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(step); } return false; }
const D=()=>fr.contentDocument;
const q=(sel)=>D().querySelector(sel);
const qa=(sel)=>D().querySelectorAll(sel);
const txt=(el)=>el?el.textContent.trim():"";

function clickBtn(sel){ const b=q(sel); if(!b) return false; b.click(); return true; }

(async function(){
  const errs=[];
  fr.src="../index.html?t="+Date.now()+"#base";
  const booted=await until(()=>{ const d=D(); return d && d.querySelector("#nsk-tabs .tab"); },25000);
  ok("游戏启动完成", booted);
  if(!booted){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  try{ fr.contentWindow.addEventListener("error", e=>errs.push(e.message)); }catch(e){}
  const NSK=fr.contentWindow.NSK;

  // ---------- 引擎级确定性测试（fresh state，直接调 Production）----------
  const fresh=()=>NSK.Engine.State.defaultState(Date.now(), NSK.Data);

  // (E1) 精炼：repeat + 仅扣首批(1×fe_ore)
  {
    const st=fresh(); const before=st.res.fe_ore;
    const r=NSK.Engine.Production.enqueue(st,"smelt","smelt_fe_alloy",5);
    ok("引擎·精炼 enqueue ok", r&&r.ok, JSON.stringify(r));
    const it=(st.base.industry.smeltQueue||[])[0];
    ok("引擎·精炼 队列项 repeat=5", it&&it.repeat===5, it?("repeat="+it.repeat):"no item");
    ok("引擎·精炼 入队只扣首批(1×fe_ore)", st.res.fe_ore===before-1, "fe_ore "+before+"->"+st.res.fe_ore);
  }
  // (E2) 装备制造：repeat + 扣成本（2026-11-03：装备走独立 equipQueue，不再占总装坞）
  {
    const st=fresh(); st.base.bodyLevel=0;
    const c=NSK.Data.Equipment.byId("t1_mining_laser").cost;
    const before=Object.assign({},st.res);
    const r=NSK.Engine.Production.buildEquipment(st,"t1_mining_laser",3);
    ok("引擎·装备制造 buildEquipment ok", r&&r.ok, JSON.stringify(r));
    const it=(st.base.industry.equipQueue||[])[0];
    ok("引擎·装备制造 队列项 repeat=3（进 equipQueue）", it&&it.repeat===3, it?("repeat="+it.repeat):"no item");
    ok("引擎·装备制造 不再占用 manufactureQueue", (st.base.industry.manufactureQueue||[]).length===0,
      "manufactureQueue="+(st.base.industry.manufactureQueue||[]).length);
    const dFe=(before.fe_alloy||0)-(st.res.fe_alloy||0), dNi=(before.ni_alloy||0)-(st.res.ni_alloy||0);
    ok("引擎·装备制造 扣成本(fe_alloy "+c.fe_alloy+" / ni_alloy "+c.ni_alloy+")", dFe===c.fe_alloy && dNi===c.ni_alloy, "Δfe="+dFe+" Δni="+dNi);
  }
  // (E3) 造船：repeat + 扣成本（1 代部件配比 cost: { struct, prop, weapon }）
  {
    const st=fresh(); st.base.bodyLevel=0;
    const s=NSK.Data.Ships.shipById("frigate"); const c=s.cost;
    const before=Object.assign({},st.res);
    const r=NSK.Engine.Production.buildShip(st,"frigate",2);
    ok("引擎·造船 buildShip ok", r&&r.ok, JSON.stringify(r));
    const it=(st.base.industry.buildQueue||[])[0];
    ok("引擎·造船 队列项 repeat=2", it&&it.repeat===2, it?("repeat="+it.repeat):"no item");
    const dSt=(before.struct||0)-(st.res.struct||0), dPr=(before.prop||0)-(st.res.prop||0), dWp=(before.weapon||0)-(st.res.weapon||0);
    ok("引擎·造船 扣成本(struct "+c.struct+" / prop "+c.prop+" / weapon "+c.weapon+")", dSt===c.struct && dPr===c.prop && dWp===c.weapon, "Δst="+dSt+" Δpr="+dPr+" Δwp="+dWp);
  }
  // (E4) 材料不足应拒绝
  {
    const st=fresh(); st.res.fe_alloy=0; st.res.ni_alloy=0;
    const r=NSK.Engine.Production.buildEquipment(st,"t1_mining_laser",1);
    ok("引擎·材料不足时拒绝制造", r&&!r.ok, JSON.stringify(r));
  }
  // (E5) 门禁：bodyLevel 不足拒绝造 cruiser(需 Lv1)
  {
    const st=fresh(); st.base.bodyLevel=0;
    const r=NSK.Engine.Production.buildShip(st,"cruiser",1);
    ok("引擎·核心等级不足拒绝造 cruiser", r&&!r.ok, JSON.stringify(r));
  }

  // ---------- UI 级流程测试（真实 DOM 驱动）----------
  // 2026-11-03：批量制造确认弹窗整块删除（app.js 140 行 + #nsk-batch-modal + CSS），
  // 连续生产统一走「舱段工作台」，可产批数改由步进器下方的 .wb-cap 提示（只提示、不 clamp）。
  ok("全站不再有 batch: 命令", qa('[data-act^="batch:"]').length===0,
    qa('[data-act^="batch:"]').length+" 个残留");
  ok("批量弹窗 DOM 已移除", !q("#nsk-batch-modal"));

  // (U1) 精炼环工作台：选配方 → 可产批数 → 连续 9999 → 加入队列 → 取消
  const smeltCard=q('[data-act="baseinfo:smelt"]');
  ok("舰基页有「精炼环」舱段卡片", !!smeltCard);
  if(smeltCard) smeltCard.click();
  const wbOpen=await until(()=>q(".wb-overlay.active"),8000);
  ok("点精炼环打开舱段工作台", wbOpen);

  let live=null, expectCap=0;
  if(wbOpen){
    const r0=q('.wb-overlay.active [data-act="workbench:sel:smelt_fe_alloy"]');
    ok("工作台列出 smelt_fe_alloy 配方", !!r0);
    if(r0) r0.click();
    await wait(300);

    live=fr.contentWindow.NSK.Core.Persistence.state;   // 实时 state（app.js 闭包同一对象）
    expectCap=Math.floor((live.res.fe_ore||0)/1);
    const capTxt=txt(q(".wb-overlay.active .wb-cap"));
    const m=/最多\s*([\d,]+)\s*批/.exec(capTxt);
    const capN=m?parseInt(m[1].replace(/,/g,"")):null;
    ok("可产批数 = floor(fe_ore / 单批成本)", capN===expectCap, "显示「"+capTxt+"」 期望 "+expectCap);

    // 「连续」= 9999 批，**不被可产上限 clamp**：引擎逐批 canAfford+spend，料不够自动停队，
    // 若 clamp 则「补料后再排」还得重按一次，语义退化。
    clickBtn('.wb-overlay.active [data-act="workbench:chip:9999"]');
    await wait(250);
    const cntRaw=txt(q(".wb-overlay.active .wb-count")).replace(/[^0-9]/g,"");
    ok("点「连续」后数量 = 9999（未被可产上限 clamp）", cntRaw==="9999", "count="+cntRaw);

    const addBtn=q('.wb-overlay.active [data-act="workbench:add"]');
    ok("加入队列按钮可用", !!addBtn && !addBtn.disabled, addBtn?(addBtn.disabled?"disabled":"enabled"):"无");
    if(addBtn) addBtn.click();
    await wait(400);
    const it=(live.base.industry.smeltQueue||[])[0];
    ok("连续入队后队列项 repeat = 9999", !!it && it.repeat===9999, it?("repeat="+it.repeat):"无队列项");

    const xBtn=q('.wb-overlay.active [data-act="workbench:cancel:smeltQueue:0"]');
    ok("队列行有 × 取消按钮", !!xBtn);
    if(xBtn) xBtn.click();
    await wait(300);
    ok("点 × 取消后队列清空", (live.base.industry.smeltQueue||[]).length===0,
      (live.base.industry.smeltQueue||[]).length+" 项");

    // 未选配方时提示应为引导文案
    clickBtn('.wb-overlay.active [data-act="workbench:cat:smelt"]');
    await wait(200);
    const wbX=q('.wb-overlay.active [data-act="workbench:close"]');
    if(wbX) wbX.click();
    await wait(250);
    ok("工作台可关闭", !q(".wb-overlay.active"));
  }

  // (U2) 六类队列都能给出可产批数（抽查 booster / equip：两者成本来源与其它队列不同）
  {
    const probe=(cardAct, recipeSel)=>{
      const c=q('[data-act="'+cardAct+'"]');
      if(!c) return "无舱段卡片";
      c.click();
      return until(()=>q(".wb-overlay.active"),8000).then(async(on)=>{
        if(!on) return "工作台未打开";
        const r=q(recipeSel);
        if(!r) return "无配方卡";
        r.click(); await wait(260);
        const t=txt(q(".wb-overlay.active .wb-cap"));
        const x=q('.wb-overlay.active [data-act="workbench:close"]'); if(x) x.click();
        await wait(200);
        return t;
      });
    };
    const bTxt=await probe("baseinfo:booster",'.wb-overlay.active .wb-recipe');
    ok("增强剂工作台给出可产批数", /最多|材料不足/.test(bTxt||""), bTxt);
    const eTxt=await probe("baseinfo:equip",'.wb-overlay.active .wb-recipe');
    ok("制造车间工作台给出可产批数", /最多|材料不足/.test(eTxt||""), eTxt);
  }

  await wait(300);
  ok("控制台无未捕获错误", errs.length===0, errs.length?errs.join(" | "):"clean");

  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
