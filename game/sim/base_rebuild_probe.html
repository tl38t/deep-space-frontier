<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>舰基页重建探针</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:1240px;height:940px;border:1px solid #ccc"></iframe>
<script>
// 探测：在舰基页（不开工作台）静置 2.6s，看 $view 的子节点是否被周期性整体替换（即每秒整页重建）。
const out=[]; let PASS=0, FAIL=0;
const log=(s)=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(n,c,e)=>{ c?PASS++:FAIL++; log((c?"[PASS] ":"[FAIL] ")+n+(e!==undefined?("  → "+e):"")); };
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr"); const D=()=>fr.contentDocument; const W=()=>fr.contentWindow;
const nav=(u)=>new Promise(res=>{ fr.onload=()=>{ fr.onload=null; res(); }; fr.src=u; });
async function until(fn,ms,step){ ms=ms||20000; step=step||150; const t0=Date.now(); while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(step);} return false; }
const booted=()=>{ const d=D(); return !!d && !!d.querySelector("#nsk-tabs .tab"); };
const q=(s)=>{ try{ return D().querySelector(s); }catch(e){ return null; } };
(async function(){
  await nav("../index.html?t="+Date.now()+"#base");
  const b0=await until(booted,25000); if(!b0){ log("启动失败"); return; }
  // 等首帧渲染稳定
  await wait(500);
  const view = q("#nsk-view");
  const a = view ? view.firstElementChild : null;
  const aHtml = view ? view.innerHTML.length : 0;
  await wait(2600); // 跨 ≥2 个 1Hz 渲染周期
  const b = view ? view.firstElementChild : null;
  const bHtml = view ? view.innerHTML.length : 0;
  ok("舰基页首子节点身份在静置期保持（未整块重建）", view && a && b && a===b, "len "+aHtml+"→"+bHtml);
  // 再采样一次，确认不是巧合
  const c = view ? view.firstElementChild : null;
  await wait(1300);
  const d = view ? view.firstElementChild : null;
  ok("二次采样仍保持", view && c && d && c===d);
  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
