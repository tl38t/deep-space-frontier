<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>story-player selftest</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:1120px;height:720px;border:1px solid #ccc"></iframe>
<script>
// 剧情播放器自测（真实打开 index.html#story，用真实 DOM 点击驱动）
//   场景1 页签与红点：新增「剧情」页签，有未播完剧情时挂红点
//   场景2 旁白句：无头像、文字上屏、进度 1/N
//   场景3 有说话人的句子：名字 + 头像 img + 缺图兜底首字母
//   场景4 选项句：渲染成按钮，且带可见的资源增减文案
//   场景5 选分支：跳到目标场景，且生效资源只加一次
//   场景6 播完：回到章节列表，标签变「重看」
const out=[]; let PASS=0, FAIL=0;
const log=(s)=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(name,cond,extra)=>{ cond?PASS++:FAIL++; log((cond?"[PASS] ":"[FAIL] ")+name+(extra!==undefined?("  → "+extra):"")); };
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr");
async function until(fn,ms,step){ ms=ms||8000; step=step||80; const t0=Date.now();
  while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(step); } return false; }

const D=()=>fr.contentDocument, W=()=>fr.contentWindow;
const q=(sel)=>D().querySelector(sel);
const qa=(sel)=>Array.from(D().querySelectorAll(sel));
const txt=(el)=>el?el.textContent.trim():"";
function clickAct(act){
  const el=D().querySelector('[data-act="'+act+'"]');
  if(!el) return null;
  el.click(); return el;
}
async function next(){ const b=D().querySelector('[data-act="story:next"]'); if(!b) return false; b.click(); await wait(70); return true; }

(async function(){
  // ---------- 装载 ----------
  fr.src="../index.html#story";
  const booted=await until(()=>{ const d=D(); return d && d.querySelector("#nsk-tabs .tab"); },15000);
  ok("游戏启动完成", booted);
  if(!booted){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }

  // ---------- 场景1：页签 + 红点 ----------
  const tabEl=D().querySelector('[data-act="tab:story"]');
  ok("存在「剧情」页签", !!tabEl, tabEl?txt(tabEl):"missing");
  ok("剧情有未播完 → 页签挂红点", !!(tabEl && tabEl.querySelector(".tab-dot")));
  ok("当前在剧情页（hash=#story）", !!q(".dlg"), q(".dlg")?"渲染了对话框":"没有对话框");

  // ---------- 场景2：旁白句 ----------
  const d1=q(".dlg");
  ok("旁白句无头像容器", !q(".dlg-av"), q(".dlg-av")?"意外出现头像":"");
  ok("旁白文字上屏", /拓殖民公社第七登记处/.test(txt(q(".dlg-text"))), txt(q(".dlg-text")).slice(0,18));
  ok("旁白用斜体旁白样式", !!q(".dlg-text.narr"));
  ok("进度显示 1 / 5", txt(q(".dlg-prog"))==="1 / 5", txt(q(".dlg-prog")));

  // ---------- 场景3：有说话人 + 头像 + 缺图兜底 ----------
  await next(); await wait(120);
  const nameEl=q(".dlg-name"), avEl=q(".dlg-av");
  ok("第二句显示说话人名", txt(nameEl)==="边疆登记官", txt(nameEl));
  ok("说话人名带角色配色", !!(nameEl && /color\s*:/.test(nameEl.getAttribute("style")||"")), nameEl?(nameEl.getAttribute("style")||""):"");
  ok("有头像 img 元素", !!q(".dlg-av img"), q(".dlg-av img")?q(".dlg-av img").getAttribute("src"):"none");
  ok("头像路径指向引导角色", /nsk_guide_registrar_bust\.webp$/.test((q(".dlg-av img")||{}).src||""), (q(".dlg-av img")||{}).src||"");
  const ph=q(".dlg-av .av-ph");
  ok("缺图兜底首字母牌存在", !!ph, ph?txt(ph):"none");
  // guides/ 目录当前无图 → 必然 onerror；给图片加载失败的传播留时间
  await until(()=>{ const a=q(".dlg-av"); return a && a.classList.contains("miss"); },3000);
  const missApplied=!!(avEl && avEl.classList.contains("miss"));
  ok("图片加载失败后容器打上 .miss（露出首字母牌）", missApplied, avEl?avEl.className:"none");

  // ---------- 场景4：推进到选项句 ----------
  let guard=0;
  while(guard++<10 && !q(".dlg-choices")){ if(!(await next())) break; await wait(90); }
  const chBtns=qa(".dlg-choice");
  ok("选项句渲染成按钮", chBtns.length===2, "按钮数 "+chBtns.length);
  ok("选项文案上屏", /反问他/.test(txt(chBtns[1])), txt(chBtns[1]).slice(0,16));
  ok("选项带资源增减提示", /\+150 星币/.test(txt(chBtns[1])), txt(chBtns[1]));
  ok("选项句不出现「下一句」（必须先选）", !q('[data-act="story:next"]'));

  // ---------- 场景5：选分支 → 跳场景 ----------
  chBtns[1].click(); await wait(220);
  ok("选完跳到支线场景", txt(q(".dlg-prog"))==="1 / 5", txt(q(".dlg-prog")));
  ok("支线首句是登记官", txt(q(".dlg-name"))==="边疆登记官", txt(q(".dlg-name")));

  // ---------- 场景6：播完回列表 ----------
  guard=0;
  while(guard++<12 && q(".dlg")){ if(!(await next())) break; await wait(90); }
  ok("播完回到章节列表", !!q(".story-list"), q(".story-list")?"列表在":"仍在对话");
  const cards=qa(".story-card");
  ok("列表只显示非隐藏章节（2 条）", cards.length===2, "卡片数 "+cards.length);
  const replay=qa(".story-card .btn, .story-card button").filter(b=>txt(b)==="重看");
  ok("已看的章节按钮变「重看」", replay.length>=1, "重看按钮 "+replay.length);
  ok("页签红点已消失（无进行中剧情）", !D().querySelector('[data-act="tab:story"] .tab-dot'));

  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
