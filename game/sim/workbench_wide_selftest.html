<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>舱段工作台 · PC 宽屏大页面回归</title></head>
<body>
<pre id="log">running...</pre>
<iframe id="fr" style="width:1200px;height:900px;border:1px solid #ccc"></iframe>
<script>
// 2026-11-13：PC 宽屏左右分栏实装后的真实 DOM 回归。
// 视口 1200px → 产品 CSS @media(min-width:900px) 分栏分支；窄屏顺序由
// workbench_interaction_selftest.html（430px iframe）覆盖。
const out=[]; let PASS=0, FAIL=0;
const log=s=>{ out.push(s); document.getElementById("log").textContent=out.join("\n"); };
const ok=(name,cond,extra)=>{ cond?PASS++:FAIL++; log((cond?"[PASS] ":"[FAIL] ")+name+(extra!==undefined?("  → "+extra):"")); };
const skip=(name,why)=>{ log("[SKIP] "+name+"  → "+why); };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fr=document.getElementById("fr");
const D=()=>fr.contentDocument, W=()=>fr.contentWindow;
const q=s=>{ try{ return D().querySelector(s); }catch(e){ return null; } };
const qa=s=>{ try{ return [...D().querySelectorAll(s)]; }catch(e){ return []; } };
const cs=(el,prop)=>{ try{ return W().getComputedStyle(el)[prop]; }catch(e){ return ""; } };
async function until(fn,ms){ ms=ms||20000; const t0=Date.now(); while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(120); } return false; }
const click=s=>{ const el=q(s); if(el){ el.click(); return true; } return false; };
let ERRS=[];
function hookErrors(){ ERRS=[]; try{ W().addEventListener("error", e=>ERRS.push(String(e.message||e.error))); }catch(e){}
  try{ W().addEventListener("unhandledrejection", e=>ERRS.push("promise:"+String(e.reason))); }catch(e){} }
function saveKey(){ try{ return Object.keys(W().localStorage).find(k=>/^nsk_save/i.test(k)); }catch(e){ return null; } }
// 宽屏下 panel 不滚，真正会滚的是右栏配方区（以及左栏/研究详情）。
const box=()=>q(".wb-col-right > .wb-recipes");
const left=()=>q(".wb-col-left");
const cards=()=>qa(".wb-recipe");
const overflowCards=()=>cards().filter(el=>el.scrollHeight>el.clientHeight+2).length;

(async function(){
  fr.src="../index.html?t="+Date.now()+"#base";
  const booted=await until(()=>!!q("#nsk-tabs .tab"),25000);
  ok("游戏启动完成", booted);
  if(!booted){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }
  hookErrors();
  const KEY=saveKey(); const BACKUP=KEY?W().localStorage.getItem(KEY):null;
  await wait(400);
  click('[data-act="tab:base"]'); await wait(700);
  await until(()=>qa(".base-module").length>0,10000);

  // ---------- 精炼环：宽屏骨架 ----------
  const sm=q("button.base-smelt");
  ok("找到精炼环卡片", !!sm);
  if(sm) sm.click();
  const opened=await until(()=>!!q(".wb-overlay.active .wb-panel"),8000);
  ok("精炼环工作台已打开", opened);
  if(!opened){ log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========"); return; }

  const p0=q(".wb-panel"), L0=left(), R0=q(".wb-col-right");
  ok("左右两栏容器均存在", !!L0 && !!R0);
  ok("panel 走 grid 两列", cs(p0,"display")==="grid" && cs(p0,"gridTemplateColumns").split(" ").length===2,
      cs(p0,"display")+" / "+cs(p0,"gridTemplateColumns"));
  ok("左栏宽 340px、右栏占剩余", Math.abs(L0.clientWidth-340)<=3 && R0.clientWidth>500,
      "left="+L0.clientWidth+" right="+R0.clientWidth);
  ok("panel 定高且不整体滚动", cs(p0,"overflowY")==="hidden" && p0.scrollHeight-p0.clientHeight<=2,
      "overflow="+cs(p0,"overflowY")+" diff="+(p0.scrollHeight-p0.clientHeight));
  ok("左栏含舱段明细与队列", !!L0.querySelector(".wb-detail") && !!L0.querySelector(".wb-queue"));
  // 2026-11-15：批量控制已从右栏移到「二级配方详情弹窗」，点配方卡弹出，右栏回归纯列表。
  const firstCard=q(".wb-recipe");
  if(firstCard) firstCard.click();
  await wait(240);
  ok("选中配方后右栏为纯列表 + 引导条",
     !!R0.querySelector(".wb-recipes") && !!q(".wb-rd-hint"));
  ok("选中配方弹出详情窗(步进器+加按钮)",
     !!q(".wb-rd-overlay.active .wb-rd-panel .wb-stepper") && !!q(".wb-rd-overlay.active .wb-rd-panel .wb-add"));
  ok("右栏配方为 3 列网格", cs(box(),"gridTemplateColumns").split(" ").length===3, cs(box(),"gridTemplateColumns"));
  ok("配方卡均未被压扁", overflowCards()===0, "cards="+cards().length+" overflow="+overflowCards());
  const topL=L0.getBoundingClientRect().top, topR=R0.getBoundingClientRect().top;
  ok("左右栏顶部对齐", Math.abs(topL-topR)<=3, "L="+Math.round(topL)+" R="+Math.round(topR));

  // ---------- 轻量交互：宽屏下也不得重建 / 跳顶 ----------
  // 精炼环配方不足以溢出，先切到造船页（45 张卡）制造可滚动场景。
  click(".wb-close"); await wait(200);
  const mf=q("button.base-manufacture");
  if(mf && !mf.classList.contains("empty")){
    mf.click();
    const opened2=await until(()=>!!q(".wb-overlay.active .wb-panel"),5000);
    ok("总装船坞工作台已打开", opened2);
    if(opened2){
      click('[data-act="workbench:tab:ship"]'); await wait(260);
      const bx=box(), maxScroll=bx.scrollHeight-bx.clientHeight;
      ok("造船页配方区可独立滚动", maxScroll>240, "maxScroll="+maxScroll);
      ok("造船页配方卡未被压扁", overflowCards()===0, "cards="+cards().length+" overflow="+overflowCards());
      const TOP=Math.min(220,Math.max(0,maxScroll-1));
      bx.scrollTop=TOP;
      const panelNode=q(".wb-panel"), gridNode=box(), firstCard=cards()[0];
      cards()[3].click(); await wait(180);
      ok("[轻量·选配方] panel 节点未替换", q(".wb-panel")===panelNode);
      ok("[轻量·选配方] 配方区节点未替换", box()===gridNode);
      ok("[轻量·选配方] 配方区滚动位置保持", box().scrollTop===TOP, "before="+TOP+" after="+box().scrollTop);
      ok("[轻量·选配方] 卡片节点身份保持", cards()[0]===firstCard);
      ok("[轻量·选配方] 选中态只落一处", qa(".wb-recipe.sel").length===1);
      click('.wb-step[data-act="workbench:count:1"]'); await wait(160);
      ok("[轻量·数量+] 配方区滚动位置保持", box().scrollTop===TOP, "after="+box().scrollTop);
      ok("[轻量·数量+] 计数为 2", ((q(".wb-count")||{}).textContent||"").trim()==="2");
      click('.wb-chip[data-act="workbench:chip:10"]'); await wait(160);
      ok("[轻量·×10] 配方区滚动位置保持", box().scrollTop===TOP, "after="+box().scrollTop);

      // 跨 1Hz 刷新：refresh() 恢复滚动快照，不得把配方区弹回顶部
      await wait(2400);
      ok("[跨周期] 配方区节点仍未被替换", box()===gridNode);
      ok("[跨周期] 配方区滚动位置仍保持", box().scrollTop===TOP, "after="+box().scrollTop);

      // ---------- 结构性变化：整块重画，但两栏与滚动位置都要回来 ----------
      box().scrollTop=TOP;
      click('[data-act="workbench:tab:component"]'); await wait(260);
      const p2=q(".wb-panel");
      ok("[结构·切页签] 确实整块重画", p2!==panelNode);
      ok("[结构·切页签] 重画后仍是左右两栏", !!q(".wb-col-left") && !!q(".wb-col-right"));
      const bx2=box(), expect=Math.min(TOP,Math.max(0,bx2.scrollHeight-bx2.clientHeight));
      ok("[结构·切页签] 配方区滚动位置已恢复", TOP>0 && Math.abs(bx2.scrollTop-expect)<=2,
          "before="+TOP+" after="+bx2.scrollTop+" expect="+expect);
      ok("[结构·切页签] 配方卡未被压扁", overflowCards()===0, "cards="+cards().length+" overflow="+overflowCards());
    }
  } else skip("总装船坞宽屏回归", "总装船坞未装配");

  // ---------- 发明舱研究页：宽屏下搜索框 / 详情容器 ----------
  click(".wb-close"); await wait(160);
  const iv=q("button.base-invent");
  if(iv && !iv.classList.contains("empty")){
    iv.click();
    const opened3=await until(()=>!!q(".wb-overlay.active .wb-panel"),5000);
    if(opened3 && q(".wb-recipe.iv-bp")){
      const pI=q(".wb-panel"), inp=q("#ivq"), sd=q(".wb-study-detail");
      ok("[研究页] 右栏为 2 列蓝图网格", cs(box(),"gridTemplateColumns").split(" ").length===2, cs(box(),"gridTemplateColumns"));
      const bpName=(q(".iv-bp-name")||{}).textContent||"";
      q(".wb-recipe.iv-bp").click(); await wait(180);
      ok("[研究页] panel 节点未被替换", q(".wb-panel")===pI);
      ok("[研究页] 搜索框节点身份保持", q("#ivq")===inp);
      ok("[研究页] 详情容器节点身份保持", q(".wb-study-detail")===sd);
      const h3=q(".wb-study-detail .iv-detail h3");
      ok("[研究页] 详情已就地更新", !!h3 && h3.textContent===bpName, h3?h3.textContent:"null");
      click('[data-act="workbench:sdir:te"]'); await wait(160);
      ok("[研究页] ME/TE 切换后 panel 未重建", q(".wb-panel")===pI);
      ok("[研究页] 方向高亮已切换", !!q('.iv-dir span[data-act="workbench:sdir:te"].on'));
    } else skip("研究页宽屏回归", "发明舱未装配或蓝图未就绪");
  } else skip("研究页宽屏回归", "发明舱未装配");

  click(".wb-close"); await wait(150);
  ok("关闭后弹窗消失", q(".wb-overlay.active")===null);
  ok("全程无未捕获错误", ERRS.length===0, ERRS.slice(0,3).join(" | ")||"无");

  if(KEY && BACKUP!==null){ try{ W().localStorage.setItem(KEY,BACKUP); log("[i] 已还原存档备份"); }catch(e){} }
  log("\n======== RESULT: PASS="+PASS+" FAIL="+FAIL+" ========");
})();
</script>
</body></html>
