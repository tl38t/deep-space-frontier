<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舰基方案 A · 本体剖面重皮</title>
<style>
:root{--bg:#0b1020;--panel:#131a30;--panel2:#1a2340;--line:#2a3558;--fg:#dce4f5;--dim:#8b96b8;--good:#5ad1a0;--warn:#e8b45a;--acc:#5a8de8;--bad:#e879a8;--card-a:#16203a;--card-b:#0f1629}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:18px;color:#fff;margin-bottom:2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.res{background:rgba(90,141,232,.1);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:13px}
.res b{color:#fff}
.panel{background:linear-gradient(160deg,#151d35,#101728);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0}
button{background:var(--acc);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;min-height:38px}
button:disabled{background:#3a4468;color:#7c86a8;cursor:not-allowed}
.tag{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px}
.tag.good{color:var(--good)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
svg{display:block;width:100%;height:auto;background:radial-gradient(circle at 50% 45%,#16203a,#0b1020);border-radius:12px;border:1px solid var(--line)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.slot{width:118px;background:rgba(90,141,232,.08);border:1px dashed var(--line);border-radius:8px;padding:8px;text-align:center;transition:.15s}
.slot.locked{opacity:.4}
.slot .ic{font-size:22px}
.slot .nm{font-size:12px;color:var(--dim);margin-top:2px}
.slot .bar{height:6px;background:#0d1329;border-radius:3px;overflow:hidden;margin-top:6px}
.slot .bar i{display:block;height:100%;background:var(--good);width:0}
.legend{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}
.note{font-size:12px;color:var(--warn);margin-top:4px}
h3{font-size:14px;color:var(--acc);margin:0 0 6px}
</style>
</head>
<body>
<h1>舰基建设 · 方案 A</h1>
<div class="sub">本体剖面重皮 —— 数据模型不变（仍是 bodyLevel + 3 队列），只把"升级 + 工业"换成可视化剖面图</div>
<div class="hud">
 <span class="res">⛁ 星币 <b id="credits">12800</b></span>
 <span class="res">🪨 矿石 <b id="ore">340</b></span>
</div>
<div class="panel">
 <div class="row"><span>本体：<b id="bodyName">空间站</b> <span class="tag" id="bodyLv">Lv.1</span></span>
   <button id="upBtn">升级本体</button></div>
 <div class="note" id="upNote"></div>
 <svg id="svg" viewBox="0 0 360 240" aria-label="舰基剖面"></svg>
 <div class="legend" id="legend"></div>
</div>
<div class="panel">
 <h3>工业槽位（挂在剖面上）</h3>
 <div class="slots" id="slots"></div>
</div>
<script>
const PLANS=[
 {name:"空间站",lv:1,slots:{smelt:1,manu:1,invent:0},cost:{credits:8000,ore:200}},
 {name:"星堡",lv:2,slots:{smelt:2,manu:2,invent:1},cost:{credits:30000,ore:600}},
 {name:"星城",lv:3,slots:{smelt:3,manu:3,invent:2},cost:{credits:80000,ore:1500}},
 {name:"深空要塞",lv:4,slots:{smelt:3,manu:3,invent:3},cost:null},
];
let lvl=0;
const svg=document.getElementById('svg');
const slotsEl=document.getElementById('slots');
const SLOT_DEF={smelt:{ic:"⚗️",nm:"精炼舱"},manu:{ic:"🔧",nm:"制造舱"},invent:{ic:"💡",nm:"发明舱"}};
function plan(){return PLANS[lvl];}
function drawSvg(){
 const p=plan();let s='';
 for(let i=0;i<46;i++){const x=(i*53)%360,y=(i*97)%240;s+=`<circle cx="${x}" cy="${y}" r="${i%5?0.6:1.1}" fill="#2a3558" opacity="${0.25+(i%3)*0.18}"/>`;}
 const cx=180,cy=120,ringN=p.lv;
 for(let r=1;r<=ringN;r++){const rad=18+r*20;
  s+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#2a3558" stroke-width="2" opacity="${0.35+r*0.13}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#5a8de8" stroke-width="1" opacity="0.14" stroke-dasharray="3 7"/>`;}
 s+=`<circle cx="${cx}" cy="${cy}" r="15" fill="#1a2340" stroke="#5a8de8" stroke-width="2"/>`;
 s+=`<circle cx="${cx}" cy="${cy}" r="5" fill="#5a8de8"><animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/></circle>`;
 const modN=2+p.lv*2,rr=18+ringN*20+9;
 for(let i=0;i<modN;i++){const ang=(i/modN)*Math.PI*2-Math.PI/2;const x=cx+Math.cos(ang)*rr,y=cy+Math.sin(ang)*rr;
  s+=`<rect x="${x-9}" y="${y-7}" width="18" height="14" rx="3" fill="#16203a" stroke="#3a4a78" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="2.2" fill="#5ad1a0"/>`;}
 if(p.lv>=3)for(let i=0;i<2;i++){const ang=-0.6+i*1.2;const x=cx+Math.cos(ang)*38,y=cy+Math.sin(ang)*38-28;
  s+=`<rect x="${x-5}" y="${y}" width="10" height="30" rx="2" fill="#1a2340" stroke="#5a8de8" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="3" fill="#e8b45a"/>`;}
 if(p.lv>=4){s+=`<rect x="${cx-3}" y="${cy-72}" width="6" height="144" rx="3" fill="#1a2340" stroke="#5a8de8" stroke-width="1.5"/>`;
  for(let i=-2;i<=2;i++){const yy=cy+i*26;s+=`<rect x="${cx-14}" y="${yy-3}" width="28" height="6" rx="3" fill="#16203a" stroke="#3a4a78"/>`;}
  s+=`<circle cx="${cx}" cy="${cy-72}" r="4" fill="#e879a8"/>`;}
 svg.innerHTML=s;
}
let barTimer=null;
function renderSlots(){
 const p=plan();let h='';
 for(const k of ['smelt','manu','invent']){const n=p.slots[k];
  for(let i=0;i<n;i++)h+=`<div class="slot"><div class="ic">${SLOT_DEF[k].ic}</div><div class="nm">${SLOT_DEF[k].nm} ${i+1}</div><div class="bar"><i></i></div></div>`;
  if(n===0&&k==='invent')h+=`<div class="slot locked"><div class="ic">🔒</div><div class="nm">发明未解锁</div></div>`;}
 slotsEl.innerHTML=h;
 if(barTimer)clearInterval(barTimer);
 const bars=slotsEl.querySelectorAll('.bar i');let t=0;
 barTimer=setInterval(()=>{t=(t+2)%100;bars.forEach((b,i)=>{b.style.width=((t+i*13)%100)+'%';});},80);
}
function refresh(){
 const p=plan();
 document.getElementById('bodyName').textContent=p.name;
 document.getElementById('bodyLv').textContent='Lv.'+p.lv;
 const up=document.getElementById('upBtn'),note=document.getElementById('upNote');
 if(p.cost===null){up.disabled=true;up.textContent='已达终级';note.textContent='';}
 else{const c=p.cost;up.disabled=false;up.textContent='升级 → '+PLANS[lvl+1].name;note.textContent='升级费用：⛁ '+c.credits+'   🪨 '+c.ore;}
 const leg={1:'本体：核心 + 2 舱段 · 精炼/制造 各 1 槽',2:'升级：+2 环 +4 臂舱 · 精炼/制造 各 2 槽 · 解锁发明 1 槽',3:'升级：+双塔 · 精炼/制造 各 3 槽 · 发明 2 槽',4:'升级：+中央脊 +要塞结构 · 全部 3 槽'}[p.lv];
 document.getElementById('legend').textContent='形态：'+leg;
 drawSvg();renderSlots();
}
document.getElementById('upBtn').onclick=()=>{
 const c=plan().cost;if(!c)return;
 document.getElementById('credits').textContent=Math.max(0,(+document.getElementById('credits').textContent)-c.credits);
 lvl++;refresh();
};
refresh();
</script>
</body>
</html>
